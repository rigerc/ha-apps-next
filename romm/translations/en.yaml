configuration:
  storage_path:
    name: Storage path
    description: Base directory below /share for the RomM library and data.
  database_name:
    name: Database name
    description: MariaDB database created and used by RomM.
  base_url:
    name: Public base URL
    description: Optional public URL used for generated links and redirects.
  log_level:
    name: Log level
    description: Runtime logging level for RomM and its bundled services.
  kiosk_mode:
    name: Kiosk mode
    description: Start RomM in read-only mode for public or display-only use.
  enable_rescan_on_filesystem_change:
    name: Rescan on file changes
    description: Watch the library and rescan after filesystem changes.
  enable_scheduled_rescan:
    name: Scheduled rescan
    description: Enable scheduled library rescans.
  scheduled_rescan_cron:
    name: Scheduled rescan cron
    description: Cron expression used for scheduled library rescans.
  disable_emulator_js:
    name: Disable EmulatorJS
    description: Disable in-browser gameplay through EmulatorJS.
  disable_ruffle_rs:
    name: Disable Ruffle
    description: Disable in-browser Flash playback through Ruffle.
  hasheous_api_enabled:
    name: Enable Hasheous
    description: Use Hasheous as a metadata provider.
  igdb_client_id:
    name: IGDB client ID
    description: Optional IGDB API client ID.
  igdb_client_secret:
    name: IGDB client secret
    description: Optional IGDB API client secret.
  screenscraper_user:
    name: ScreenScraper user
    description: Optional ScreenScraper username.
  screenscraper_password:
    name: ScreenScraper password
    description: Optional ScreenScraper password.
  retroachievements_api_key:
    name: RetroAchievements API key
    description: Optional RetroAchievements API key.
  steamgriddb_api_key:
    name: SteamGridDB API key
    description: Optional SteamGridDB API key.
  mobygames_api_key:
    name: MobyGames API key
    description: Optional MobyGames API key.
network:
  8080/tcp: RomM web interface
